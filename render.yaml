databases:
  - name: jsm-db-v2
    plan: free

services:
  # Django Backend
  - type: web
    name: jsm-api-v2
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "cd backend && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jsm-db-v2
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000" # Update in dashboard after frontend is live
    rootDir: backend

  # Next.js Frontend (Optional on Render, better on Vercel)
  - type: web
    name: jsm-web-v2
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: jsm-api-v2
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_VERSION
        value: "20.0.0"
    rootDir: frontend
